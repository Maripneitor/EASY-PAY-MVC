services:
  user-service:
    build:
      context: ./apps/api-backend
      dockerfile: Dockerfile
    container_name: easy-pay-user-service
    ports:
      - "8001:8000"
    volumes:
      - ./apps/api-backend:/app
    env_file:
      - .env
      - ./apps/api-backend/.env
    command: uvicorn main_auth:app --host 0.0.0.0 --port 8000

  group-service:
    build:
      context: ./apps/api-backend
